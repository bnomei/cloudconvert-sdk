[package]
name = "cloudconvert-sdk"
version = "0.1.0"
edition = "2024"

[features]
default = []
retry = []

[dependencies]
base64 = "0.22.1"
bytes = "1.11.1"
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "multipart", "stream", "rustls", "query"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time", "net", "fs", "io-util", "sync"] }
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
rstest = "0.26.1"
tokio = { version = "1.52.3", features = ["test-util"] }
tower = "0.5.3"
